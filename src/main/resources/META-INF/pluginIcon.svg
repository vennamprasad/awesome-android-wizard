<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" fill="none">
    <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="100%" stop-color="#1E293B"/>
        </linearGradient>
        <linearGradient id="androidGreen" x1="8" y1="8" x2="32" y2="32" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#3DDC84"/>
            <stop offset="100%" stop-color="#10B981"/>
        </linearGradient>
        <linearGradient id="sparkGrad" x1="22" y1="6" x2="34" y2="18" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FCD34D"/>
            <stop offset="100%" stop-color="#F59E0B"/>
        </linearGradient>
        <filter id="shadow" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>
    <!-- Background rounded squircle -->
    <rect width="40" height="40" rx="9" fill="url(#bgGrad)"/>
    <rect x="0.5" y="0.5" width="39" height="39" rx="8.5" stroke="#334155" stroke-width="1"/>

    <!-- Android Core Geometry / Head silhouette -->
    <path d="M12 24C12 18.5 15.5 15 20 15C24.5 15 28 18.5 28 24H12Z" fill="url(#androidGreen)"/>
    <!-- Antennas -->
    <line x1="15.5" y1="14.5" x2="13" y2="10" stroke="#3DDC84" stroke-width="2" stroke-linecap="round"/>
    <line x1="24.5" y1="14.5" x2="27" y2="10" stroke="#3DDC84" stroke-width="2" stroke-linecap="round"/>
    <!-- Eyes -->
    <circle cx="16" cy="20" r="1.3" fill="#0F172A"/>
    <circle cx="24" cy="20" r="1.3" fill="#0F172A"/>

    <!-- Architecture Stack Layers -->
    <rect x="11" y="26" width="18" height="2.5" rx="1.25" fill="#38BDF8"/>
    <rect x="9" y="30" width="22" height="2.5" rx="1.25" fill="#818CF8"/>

    <!-- Wizard Magic Sparkle / Star -->
    <path d="M29 6L30.2 9.8L34 11L30.2 12.2L29 16L27.8 12.2L24 11L27.8 9.8L29 6Z" fill="url(#sparkGrad)"/>
    <circle cx="21" cy="7" r="1" fill="#FDE68A"/>
</svg>
